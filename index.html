<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Solo & Multiplayer</title>
    <!-- Include PeerJS for P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #00ffcc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin: 10px 0;
            color: var(--accent-color);
            letter-spacing: 2px;
        }

        #menu, #multi-setup {
            text-align: center;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        button {
            background-color: var(--accent-color);
            border: none;
            color: #000;
            padding: 12px 24px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.8;
            transform: scale(1.05);
        }

        input {
            padding: 10px;
            font-size: 16px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 5px;
            margin: 5px;
        }

        .hidden {
            display: none !important;
        }

        #game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .player-board-wrapper {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }

        .board-layout {
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            display: block;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        .preview-container {
            background: #000;
            border: 2px solid #333;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }

        #room-info {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            word-break: break-all;
        }

        /* Game Over Overlay */
        .game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            z-index: 10;
        }

        .game-over-overlay h2 {
            color: #ff5555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1>TETRIS</h1>

    <!-- Main Menu -->
    <div id="menu">
        <h2>Select Mode</h2>
        <button onclick="startSolo()">Solo Mode</button>
        <button onclick="showMultiplayerSetup()">Multiplayer Mode</button>
    </div>

    <!-- Multiplayer Setup Menu -->
    <div id="multi-setup" class="hidden">
        <h2>Multiplayer Lobby</h2>
        <button onclick="createHost()">Create Host Room</button>
        <br><br>
        <div>
            <input type="text" id="room-code-input" placeholder="Enter Host Room ID">
            <button onclick="joinRoom()">Join Room</button>
        </div>
        <div id="room-info"></div>
        <br>
        <button style="background:#555; color:#fff;" onclick="location.reload()">Back to Menu</button>
    </div>

    <!-- Game Boards Container -->
    <div id="game-container" class="hidden">
        <!-- Player 1 / Local Player -->
        <div class="player-board-wrapper" id="p1-wrapper-box">
            <h3 id="p1-title">Player</h3>
            <div class="board-layout">
                <canvas id="tetris-local" width="200" height="400"></canvas>
                <div class="side-panel">
                    <div>
                        <div style="font-size: 14px; margin-bottom: 5px; color: #aaa;">Next:</div>
                        <div class="preview-container">
                            <canvas id="preview-local" width="80" height="80"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="stats">Score: <span id="p1-score">0</span></div>
            <!-- Game Over Screen Overlay -->
            <div id="p1-game-over" class="game-over-overlay hidden">
                <h2>GAME OVER</h2>
                <button onclick="restartGame()">Play Again</button>
            </div>
        </div>

        <!-- Player 2 / Opponent (Multiplayer only) -->
        <div id="p2-wrapper" class="player-board-wrapper hidden">
            <h3>Opponent</h3>
            <div class="board-layout">
                <canvas id="tetris-remote" width="200" height="400"></canvas>
                <div class="side-panel">
                    <div>
                        <div style="font-size: 14px; margin-bottom: 5px; color: #aaa;">Next:</div>
                        <div class="preview-container">
                            <canvas id="preview-remote" width="80" height="80"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="stats">Score: <span id="p2-score">0</span></div>
            <div id="p2-game-over" class="game-over-overlay hidden">
                <h2>OPPONENT LOST</h2>
            </div>
        </div>
    </div>

    <script>
        const BLOCK_SIZE = 20;
        const COLS = 10;
        const ROWS = 20;

        const SHAPES = [
            null,
            [[0, 0, 0], [1, 1, 1], [0, 1, 0]], // T
            [[0, 2, 2], [2, 2, 0], [0, 0, 0]], // Z
            [[3, 3, 0], [0, 3, 3], [0, 0, 0]], // S
            [[0, 0, 4, 0], [0, 0, 4, 0], [0, 0, 4, 0], [0, 0, 4, 0]], // I
            [[5, 5], [5, 5]], // O
            [[6, 0, 0], [6, 6, 6], [0, 0, 0]], // J
            [[0, 0, 7], [7, 7, 7], [0, 0, 0]]  // L
        ];

        const COLORS = [
            null,
            '#9b5fe0', '#16a4d8', '#60d394', '#f78888', '#f3c68f', '#32746d', '#ff9770'
        ];

        let peer = null;
        let conn = null;
        let isMultiplayer = false;
        let isHost = false;

        let localGame = null;
        let remoteGame = null;

        class Tetris {
            constructor(canvasId, scoreId, previewId, gameOverId, isRemote = false) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.previewCanvas = document.getElementById(previewId);
                this.previewCtx = this.previewCanvas.getContext('2d');
                this.scoreElement = document.getElementById(scoreId);
                this.gameOverElement = document.getElementById(gameOverId);
                this.isRemote = isRemote;

                this.reset();
            }

            reset() {
                this.grid = this.createMatrix(COLS, ROWS);
                this.score = 0;
                this.lines = 0;
                this.gameOver = false;
                this.dropInterval = 1000;
                this.dropCounter = 0;
                this.lastTime = 0;

                this.player = {
                    pos: { x: 0, y: 0 },
                    matrix: null,
                    nextMatrix: null
                };

                if (this.gameOverElement) {
                    this.gameOverElement.classList.add('hidden');
                }
                this.updateScore();
            }

            createMatrix(w, h) {
                const matrix = [];
                while (h--) {
                    matrix.push(new Array(w).fill(0));
                }
                return matrix;
            }

            drawMatrix(ctx, matrix, offset, blockSize = BLOCK_SIZE) {
                matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            ctx.fillStyle = COLORS[value];
                            ctx.fillRect((x + offset.x) * blockSize, (y + offset.y) * blockSize, blockSize, blockSize);
                            ctx.strokeStyle = '#000';
                            ctx.strokeRect((x + offset.x) * blockSize, (y + offset.y) * blockSize, blockSize, blockSize);
                        }
                    });
                });
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                this.drawMatrix(this.ctx, this.grid, { x: 0, y: 0 });
                if (this.player.matrix) {
                    this.drawMatrix(this.ctx, this.player.matrix, this.player.pos);
                }

                // Draw Preview
                this.previewCtx.fillStyle = '#000';
                this.previewCtx.fillRect(0, 0, this.previewCanvas.width, this.previewCanvas.height);
                if (this.player.nextMatrix) {
                    const previewBlockSize = 16;
                    const offsetX = (this.previewCanvas.width / previewBlockSize - this.player.nextMatrix[0].length) / 2;
                    const offsetY = (this.previewCanvas.height / previewBlockSize - this.player.nextMatrix.length) / 2;
                    this.drawMatrix(this.previewCtx, this.player.nextMatrix, { x: offsetX, y: offsetY }, previewBlockSize);
                }
            }

            merge() {
                this.player.matrix.forEach((row, y) => {
                    row.forEach((value, x) => {
                        if (value !== 0) {
                            this.grid[y + this.player.pos.y][x + this.player.pos.x] = value;
                        }
                    });
                });
            }

            collide(player = this.player) {
                const [m, o] = [player.matrix, player.pos];
                for (let y = 0; y < m.length; ++y) {
                    for (let x = 0; x < m[y].length; ++x) {
                        if (m[y][x] !== 0 &&
                           (this.grid[y + o.y] && this.grid[y + o.y][x + o.x]) !== 0) {
                            return true;
                        }
                    }
                }
                return false;
            }

            playerDrop() {
                if (this.gameOver) return;
                this.player.pos.y++;
                if (this.collide()) {
                    this.player.pos.y--;
                    this.merge();
                    this.sweepLines();
                    this.spawnPiece();
                }
                this.dropCounter = 0;
                this.syncState();
            }

            playerHardDrop() {
                if (this.gameOver) return;
                while (!this.collide()) {
                    this.player.pos.y++;
                }
                this.player.pos.y--;
                this.merge();
                this.sweepLines();
                this.spawnPiece();
                this.dropCounter = 0;
                this.syncState();
            }

            playerMove(dir) {
                if (this.gameOver) return;
                this.player.pos.x += dir;
                if (this.collide()) {
                    this.player.pos.x -= dir;
                }
                this.syncState();
            }

            playerRotate() {
                if (this.gameOver) return;
                const pos = this.player.pos.x;
                let offset = 1;
                this.rotate(this.player.matrix);
                while (this.collide()) {
                    this.player.pos.x += offset;
                    offset = -(offset + (offset > 0 ? 1 : -1));
                    if (offset > this.player.matrix[0].length) {
                        this.rotate(this.player.matrix, -1);
                        this.player.pos.x = pos;
                        return;
                    }
                }
                this.syncState();
            }

            rotate(matrix, dir = 1) {
                for (let y = 0; y < matrix.length; ++y) {
                    for (let x = 0; x < y; ++x) {
                        [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
                    }
                }
                if (dir > 0) {
                    matrix.forEach(row => row.reverse());
                } else {
                    matrix.reverse();
                }
            }

            spawnPiece() {
                if (this.player.nextMatrix === null) {
                    const firstId = Math.floor(Math.random() * 7) + 1;
                    const nextId = Math.floor(Math.random() * 7) + 1;
                    this.player.matrix = SHAPES[firstId];
                    this.player.nextMatrix = SHAPES[nextId];
                } else {
                    this.player.matrix = this.player.nextMatrix;
                    const nextId = Math.floor(Math.random() * 7) + 1;
                    this.player.nextMatrix = SHAPES[nextId];
                }

                this.player.pos.y = 0;
                this.player.pos.x = Math.floor((COLS - this.player.matrix[0].length) / 2);

                if (this.collide()) {
                    this.gameOver = true;
                    if (this.gameOverElement) {
                        this.gameOverElement.classList.remove('hidden');
                    }
                    if (!this.isRemote && isMultiplayer && conn && conn.open) {
                        conn.send({ type: 'gameover' });
                    }
                }
            }

            sweepLines() {
                let rowCount = 0;
                outer: for (let y = this.grid.length - 1; y > 0; --y) {
                    for (let x = 0; x < this.grid[y].length; ++x) {
                        if (this.grid[y][x] === 0) {
                            continue outer;
                        }
                    }
                    const row = this.grid.splice(y, 1)[0].fill(0);
                    this.grid.unshift(row);
                    ++y;
                    rowCount++;
                }

                if (rowCount > 0) {
                    this.score += rowCount * 10 * rowCount;
                    this.lines += rowCount;
                    this.dropInterval = Math.max(100, 1000 - (this.lines * 50));
                    this.updateScore();
                }
            }

            updateScore() {
                this.scoreElement.innerText = this.score;
            }

            syncState() {
                if (isMultiplayer && conn && conn.open && !this.isRemote) {
                    conn.send({
                        type: 'state',
                        grid: this.grid,
                        matrix: this.player.matrix,
                        nextMatrix: this.player.nextMatrix,
                        pos: this.player.pos,
                        score: this.score,
                        gameOver: this.gameOver
                    });
                }
            }

            update(time = 0) {
                if (!this.isRemote && !this.gameOver) {
                    const deltaTime = time - this.lastTime;
                    this.lastTime = time;
                    this.dropCounter += deltaTime;
                    if (this.dropCounter > this.dropInterval) {
                        this.playerDrop();
                    }
                }
                this.draw();
                requestAnimationFrame((t) => this.update(t));
            }
        }

        function startSolo() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('p1-title').innerText = 'Solo Player';

            localGame = new Tetris('tetris-local', 'p1-score', 'preview-local', 'p1-game-over');
            localGame.spawnPiece();
            localGame.update();
            setupControls();
        }

        function restartGame() {
            if (localGame) {
                localGame.reset();
                localGame.spawnPiece();
            }
            if (isMultiplayer && conn && conn.open) {
                conn.send({ type: 'restart' });
            }
        }

        function showMultiplayerSetup() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('multi-setup').classList.remove('hidden');
        }

        function createHost() {
            peer = new Peer();
            peer.on('open', (id) => {
                isHost = true;
                document.getElementById('room-info').innerText = `Your Room Code: ${id}\nWaiting for opponent...`;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                initMultiplayerGame();
            });
        }

        function joinRoom() {
            const roomId = document.getElementById('room-code-input').value.trim();
            if (!roomId) return alert('Please enter a room code');

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(roomId);
                conn.on('open', () => {
                    isHost = false;
                    initMultiplayerGame();
                });
            });
        }

        function initMultiplayerGame() {
            isMultiplayer = true;
            document.getElementById('multi-setup').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            document.getElementById('p2-wrapper').classList.remove('hidden');
            document.getElementById('p1-title').innerText = isHost ? 'Host (You)' : 'Client (You)';

            localGame = new Tetris('tetris-local', 'p1-score', 'preview-local', 'p1-game-over', false);
            remoteGame = new Tetris('tetris-remote', 'p2-score', 'preview-remote', 'p2-game-over', true);

            localGame.spawnPiece();
            localGame.update();
            remoteGame.update();
            setupControls();

            conn.on('data', (data) => {
                if (data.type === 'state') {
                    remoteGame.grid = data.grid;
                    remoteGame.player.matrix = data.matrix;
                    remoteGame.player.nextMatrix = data.nextMatrix;
                    remoteGame.player.pos = data.pos;
                    remoteGame.score = data.score;
                    remoteGame.updateScore();
                    if (data.gameOver) {
                        remoteGame.gameOver = true;
                        remoteGame.gameOverElement.classList.remove('hidden');
                    } else {
                        remoteGame.gameOver = false;
                        remoteGame.gameOverElement.classList.add('hidden');
                    }
                } else if (data.type === 'gameover') {
                    remoteGame.gameOver = true;
                    remoteGame.gameOverElement.classList.remove('hidden');
                } else if (data.type === 'restart') {
                    remoteGame.reset();
                }
            });
        }

        function setupControls() {
            window.addEventListener('keydown', event => {
                if (!localGame || localGame.gameOver) return;
                if (event.key === 'ArrowLeft') {
                    localGame.playerMove(-1);
                } else if (event.key === 'ArrowRight') {
                    localGame.playerMove(1);
                } else if (event.key === 'ArrowDown') {
                    localGame.playerDrop();
                } else if (event.key === 'ArrowUp') {
                    localGame.playerRotate();
                } else if (event.key === ' ') {
                    event.preventDefault();
                    localGame.playerHardDrop();
                }
            });
        }
    </script>
</body>
</html>
